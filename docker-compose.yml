services:
  meettrack-db:
    image: postgres:16-alpine
    container_name: meettrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - meettrack-db-data:/var/lib/postgresql/data
    networks:
      - meettrack-net

  meettrack-api:
    build:
      context: ../meettrack-api
      dockerfile: src/MeetTrack.Api/Dockerfile
    container_name: meettrack-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=meettrack-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: meettrack-api
      Jwt__Audience: meettrack-web
      Jitsi__Domain: ${JITSI_DOMAIN}
      Jitsi__AppId: ${JITSI_APP_ID}
      Jitsi__AppSecret: ${JITSI_APP_SECRET}
      Jitsi__WebhookSecret: ${JITSI_WEBHOOK_SECRET}
      Minio__Endpoint: meettrack-minio:9000
      Minio__AccessKey: ${MINIO_USER}
      Minio__SecretKey: ${MINIO_PASSWORD}
      Minio__BucketName: recordings
      Minio__UseSSL: "false"
      # Browser-recording чанки — на volume, чтобы переживали редеплой/рестарт API
      # (иначе незавершённая запись теряется). Путь совпадает с volume-точкой ниже.
      Recording__ChunkStoragePath: /var/lib/meettrack/chunks
      # FCM: без этого пути Program.cs молча регистрирует NoOpFcmService и
      # мобильные коллекторы не получают пушей о входящих звонках.
      Fcm__CredentialsPath: /app/firebase-admin-key.json
      # Broadcast («канал объявлений»): RTMP-ingest MediaMTX (внутренний IP d01, куда
      # Jibri с d03 публикует поток) и публичный HLS-URL для зрителей.
      Broadcast__RtmpBaseUrl: rtmp://10.120.4.14:1935
      Broadcast__HlsBaseUrl: https://${DOMAIN:-meet-track-dev.ipoint.uz}/hls
    depends_on:
      - meettrack-db
      - meettrack-minio
    volumes:
      - meettrack-recording-chunks:/var/lib/meettrack/chunks
      - /opt/meettrack/firebase-admin-key.json:/app/firebase-admin-key.json:ro
    networks:
      - meettrack-net

  meettrack-minio:
    image: minio/minio:latest
    container_name: meettrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - meettrack-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - meettrack-net

  # MediaMTX — RTMP-ingest от Jibri (d03) → транскод в 480p → HLS в общий volume.
  # Роль вынесена отдельно, чтобы НЕ менять разрешение записей Jibri. Порт 1935
  # публикуется на хост d01, чтобы Jibri по внутреннему IP (10.120.4.14:1935) мог
  # опубликовать поток. HLS отдаёт nginx (meettrack-web) из общего volume.
  meettrack-mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: meettrack-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (Jibri публикует сюда)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - meettrack-hls:/hls
    networks:
      - meettrack-net

  meettrack-web:
    image: nginx:alpine
    container_name: meettrack-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../meettrack-web/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HLS-сегменты broadcast (пишет MediaMTX, nginx раздаёт read-only).
      # Монтируем под /var/www/hls, чтобы URL /hls/{id}/... совпадал с root /var/www.
      - meettrack-hls:/var/www/hls:ro
    depends_on:
      - meettrack-api
      - meettrack-mediamtx
    networks:
      - meettrack-net

volumes:
  meettrack-db-data:
  meettrack-minio-data:
  meettrack-recording-chunks:
  # HLS-сегменты broadcast: пишет MediaMTX, читает nginx (meettrack-web).
  meettrack-hls:

networks:
  meettrack-net:
    driver: bridge
