jibri {
    chrome {
        flags = [
            "--use-fake-ui-for-media-stream",
            "--start-maximized",
            "--kiosk",
            "--enabled",
            "--disable-infobars",
            "--autoplay-policy=no-user-gesture-required",
            "--ignore-certificate-errors",
            "--start-fullscreen"
        ]
    }
    ffmpeg {
        # 1280x720: dummy Xorg-дисплей жёстко ограничен 720p (xorg-video-dummy.conf,
        # 1920x1080 отвергается как "width too large for virtual size") — ffmpeg x11grab
        # 1080p падает с "Invalid argument". Для broadcast видео всё равно отбрасывается
        # (audio-only на MediaMTX), для записи звонков 720p — штатное разрешение.
        resolution = "1280x720"
        framerate = 30
    }
    streaming {
        # Разрешаем стрим на произвольный RTMP (MediaMTX d01). Для записей звонков
        # этот блок роли не играет. Дублируется патчем в Dockerfile на случай, если
        # этот файл не подхватывается include'ом эффективного jibri.conf.
        rtmp-allow-list = [ ".*" ]
    }
}
