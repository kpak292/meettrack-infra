jibri {
    chrome {
        flags = [
            "--use-fake-ui-for-media-stream",
            "--start-maximized",
            "--kiosk",
            "--enabled",
            "--disable-infobars",
            "--autoplay-policy=no-user-gesture-required",
            "--ignore-certificate-errors",
            "--start-fullscreen"
        ]
    }
    ffmpeg {
        resolution = "1920x1080"
        framerate = 30
    }
    streaming {
        # Разрешаем стрим на произвольный RTMP (MediaMTX d01). Для записей звонков
        # этот блок роли не играет. Дублируется патчем в Dockerfile на случай, если
        # этот файл не подхватывается include'ом эффективного jibri.conf.
        rtmp-allow-list = [ ".*" ]
    }
}
