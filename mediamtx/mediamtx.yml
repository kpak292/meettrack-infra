# MediaMTX для «канала объявлений» (broadcast) на d01.
# Роль: принять WebRTC (WHIP) от БРАУЗЕРА АДМИНА (микрофон) и раздать зрителям audio-HLS.
# Jibri из трансляции УБРАН — вещает сам браузер админа (модель «говорит только админ»),
# поэтому Jibri свободен для записи обычных звонков.
#
# Поток: браузер админа ─WHIP─▶ MediaMTX ─(ffmpeg, audio-only)─▶ HLS ─▶ nginx ─▶ зрители

logLevel: info

# --- Ingest: WebRTC/WHIP (браузер админа публикует микрофон) ---
webrtc: yes
webrtcAddress: :8889
# Медиа (SRTP) идёт по UDP напрямую браузер↔d01. Один фиксированный порт — проще для
# фаервола. Публичный IP d01 анонсируется как ICE-кандидат (браузер за NAT достучится).
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [157.22.128.243]

# --- Внутреннее чтение для ffmpeg (только localhost) ---
rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

# Не нужны наружу
rtmp: no
hls: no
srt: no

# API для health/диагностики
api: yes
apiAddress: :9997

pathDefaults:
  # Как только браузер админа начал публиковать (path = broadcastId), поднимаем ffmpeg:
  # читаем локально по RTSP, отбрасываем видео (-vn), транскодим Opus→AAC 64k и пишем
  # audio-HLS в /hls/$MTX_PATH/. Аплинк d01 ~100 Мбит/с → 64k×373≈24 Мбит/с проходит.
  runOnReady: >
    sh -c "mkdir -p /hls/$MTX_PATH &&
    ffmpeg -nostdin -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:8554/$MTX_PATH
    -vn -c:a aac -b:a 64k -ac 2
    -f hls -hls_time 2 -hls_list_size 6
    -hls_flags delete_segments+append_list+omit_endlist
    -hls_segment_filename /hls/$MTX_PATH/seg_%d.ts /hls/$MTX_PATH/index.m3u8"
  runOnReadyRestart: yes
  # Админ прекратил вещание (закрыл WHIP) — чистим сегменты.
  runOnNotReady: sh -c "rm -rf /hls/$MTX_PATH"

paths:
  all_others:
