server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    client_max_body_size 500M;
    server_name _;

    ssl_certificate /etc/nginx/ssl/app.crt;
    ssl_certificate_key /etc/nginx/ssl/app.key;

    root /usr/share/nginx/html;
    index index.html;

    # Jitsi config files
    location = /config.js {
        proxy_pass http://10.120.4.15:80/config.js;
        proxy_set_header Host $host;
    }
    location = /interface_config.js {
        proxy_pass http://10.120.4.15:80/interface_config.js;
        proxy_set_header Host $host;
    }
    location = /external_api.js {
        proxy_pass http://10.120.4.15:80/external_api.js;
        proxy_set_header Host $host;
    }
    location = /pwa-worker.js {
        proxy_pass http://10.120.4.15:80/pwa-worker.js;
        proxy_set_header Host $host;
    }

    # Jitsi WebSocket
    location /xmpp-websocket {
        proxy_pass http://10.120.4.15:80/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /http-bind {
        proxy_pass http://10.120.4.15:80/http-bind;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Jitsi static assets
    location /libs/ { proxy_pass http://10.120.4.15:80/libs/; proxy_set_header Host $host; }
    location /css/ { proxy_pass http://10.120.4.15:80/css/; proxy_set_header Host $host; }
    location /images/ { proxy_pass http://10.120.4.15:80/images/; proxy_set_header Host $host; }
    location /sounds/ { proxy_pass http://10.120.4.15:80/sounds/; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://10.120.4.15:80/static/; proxy_set_header Host $host; }
    location /lang/ { proxy_pass http://10.120.4.15:80/lang/; proxy_set_header Host $host; }

    # Jitsi rooms
    location /jitsi/ {
        proxy_pass http://10.120.4.15:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket
    location /hubs/ {
        proxy_pass http://meettrack-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Recording upload — large files, slow links from Jibri host. Default
    # proxy_read/send_timeout=60s and request buffering caused 24 video
    # uploads to silently fail (audio extract still succeeded so the meeting
    # ended up audio-only). Stream the body straight through and give it
    # 10 minutes to land.
    location = /api/v1/recordings/upload {
        client_max_body_size 2G;
        proxy_pass http://meettrack-api:8080;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WHIP-ингест трансляции: браузер админа публикует микрофон (WebRTC).
    # /whip/{broadcastId} → MediaMTX WHIP endpoint. Медиа (SRTP) идёт мимо nginx по UDP.
    location ~ ^/whip/(?<bcid>[a-zA-Z0-9-]+)$ {
        # proxy_pass с переменной ($bcid) → nginx резолвит хостнейм в рантайме,
        # нужен resolver (встроенный Docker DNS 127.0.0.11), иначе 502.
        resolver 127.0.0.11 valid=10s;
        set $whip_upstream meettrack-mediamtx;
        proxy_pass http://$whip_upstream:8889/$bcid/whip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WHIP: POST(offer)/PATCH(trickle)/DELETE(stop), тело application/sdp
        proxy_pass_request_headers on;
    }

    # HLS «канала объявлений» (broadcast). Сегменты пишет MediaMTX в общий volume,
    # смонтированный в /var/www/hls; URL /hls/{id}/... через root /var/www попадает
    # ровно в него. Плейлист .m3u8 — НИКОГДА не кэшировать (живой, обновляется каждые
    # 2с), сегменты .ts — короткий кэш (скользящее окно). root (не alias), чтобы
    # вложенные regex-локации отрабатывали корректно.
    location /hls/ {
        root /var/www;
        try_files $uri =404;

        location ~ \.m3u8$ {
            root /var/www;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            default_type application/vnd.apple.mpegurl;
        }
        location ~ \.ts$ {
            root /var/www;
            add_header Cache-Control "public, max-age=10";
            add_header Access-Control-Allow-Origin "*";
            default_type video/mp2t;
        }
    }

    # API
    location /api/ {
        proxy_pass http://meettrack-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хешированные ассеты vite — контент неизменен при изменении имени, кэшируем навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # Точка входа SPA и метка версии — НИКОГДА не кэшировать, иначе вкладки залипают
    # на старом бандле (старый поток звонка без browser-recording). Перезагрузка
    # должна всегда тянуть свежий index.html со ссылками на новые ассеты.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Vue SPA (catch-all LAST)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
